<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>letterbox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #0f0e17;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'SF Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
#stage {
  width: 90vw;
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.5em;
  overflow: hidden;
}
#display {
  display: block;
  max-width: 100%;
  white-space: normal;
  word-break: normal;
  overflow-wrap: normal;
  font-size: 200px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
}
.word {
  display: inline-block;
  white-space: nowrap;
}
.letter {
  display: inline-block;
  will-change: transform;
  text-shadow: 0 0 0.05em rgba(255, 220, 180, 0.15);
}
.letter.pop {
  animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes pop-in {
  0%   { transform: scale(0) translateY(0.12em); opacity: 0; filter: brightness(3); }
  50%  { transform: scale(1.18) translateY(-0.02em); opacity: 1; filter: brightness(1.2); }
  100% { transform: scale(1) translateY(0); opacity: 1; filter: brightness(1); }
}
.letter.space {
  width: 0.35em;
  display: inline-block;
  animation: none;
}
#display.party .letter:not(.space) {
  animation: letter-breathe 0.7s ease-in-out infinite;
}
@keyframes letter-breathe {
  0%, 100% { transform: scale(1) translateY(0); filter: brightness(1); }
  50%      { transform: scale(1.08) translateY(-0.04em); filter: brightness(1.3); }
}
#cursor {
  display: inline-block;
  width: 0.06em;
  height: 0.65em;
  background: rgba(245, 232, 208, 0.6);
  vertical-align: baseline;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 0.3; }
  50%      { opacity: 1; }
}
#pulse {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: rgba(255, 248, 238, 0.06);
  opacity: 0;
  transition: opacity 0.18s ease;
}
#pulse.active { opacity: 1; }
#party-flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease;
}
#party-flash.active { opacity: 1; }
#hint {
  position: fixed;
  bottom: 2rem;
  left: 0; right: 0;
  text-align: center;
  color: rgba(245, 232, 208, 0.18);
  font-size: 0.85rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
#hint.hidden { opacity: 0; }
#palette-tag {
  position: fixed;
  bottom: 3.5rem;
  left: 0; right: 0;
  text-align: center;
  color: rgba(245, 232, 208, 0.15);
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
#palette-tag.show { opacity: 1; }
#clear-btn {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  outline: none;
  animation: orb-float 4s ease-in-out infinite;
  transition: background 0.4s ease, box-shadow 0.4s ease;
}
#clear-btn:hover  { transform: scale(1.18); }
#clear-btn:active { transform: scale(0.9);  }
@keyframes orb-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}
#party-btn {
  position: fixed;
  bottom: 1.5rem;
  left: 1.5rem;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  outline: none;
  animation: orb-float 4s ease-in-out infinite;
  transition: background 0.4s ease, box-shadow 0.4s ease;
  background: radial-gradient(circle at 35% 35%, rgba(160,90,210,0.45), rgba(160,90,210,0.05));
  box-shadow: 0 0 0.6rem rgba(160,90,210,0.2);
}
#party-btn:hover  { transform: scale(1.18); }
#party-btn:active { transform: scale(0.9);  }
#party-btn.on {
  animation: hue-spin 2s linear infinite, orb-float 4s ease-in-out infinite;
  background: radial-gradient(circle at 35% 35%, rgba(255,120,180,0.55), rgba(255,120,180,0.08));
  box-shadow: 0 0 0.8rem rgba(255,120,180,0.35);
}
@keyframes hue-spin {
  from { filter: hue-rotate(0deg); }
  to   { filter: hue-rotate(360deg); }
}
</style>
</head>
<body>
<div id="stage">
  <div id="display"><span id="letters"></span><span id="cursor"></span></div>
</div>
<div id="pulse"></div>
<div id="party-flash"></div>
<div id="hint">type &mdash; esc to clear &mdash; tab for palette &mdash; click the orbs</div>
<span id="palette-tag"></span>
<button id="clear-btn" aria-label="clear"></button>
<button id="party-btn" aria-label="party mode"></button>
<script>
// ---- palettes ----
const PALETTES = [
  { name: 'ember', colors: ['#e85d3a','#d4a34a','#c4a882','#f0d5b0','#8b6b4d'] },
  { name: 'ocean', colors: ['#1a7a9e','#4ab8c4','#7dd4d0','#b8dfe6','#e2f4f0'] },
  { name: 'forest', colors: ['#2d5a3a','#5a8a4a','#8aaa6a','#a8c88a','#c8e0b0'] },
  { name: 'sunset', colors: ['#c45a6a','#e88a5a','#f0b88a','#b87aaa','#8a5a9a'] },
  { name: 'pastel', colors: ['#f0c4c4','#d4e0f0','#c4e0d0','#e8d4e0','#e0e0c4'] },
  { name: 'nordic', colors: ['#e8d0b8','#c4b8a0','#a09888','#d4c8b0','#f0e4d0'] },
  { name: 'tropical', colors: ['#e85a3a','#f0c040','#40b86a','#c05aaa','#40a0d0'] },
  { name: 'desert', colors: ['#c0805a','#a08858','#d4b080','#708058','#e0c8a0'] },
  { name: 'jewel', colors: ['#c04040','#4080c0','#40a060','#c0a040','#8040c0'] },
  { name: 'candy', colors: ['#f080a0','#80d080','#80c0f0','#f0d080','#d080f0'] },
  { name: 'midnight', colors: ['#2a4a6a','#4a6a8a','#6a8aaa','#8aaaaa','#aaaac8'] },
  { name: 'vintage', colors: ['#c8a878','#a88868','#a0b8a0','#c8b898','#8a7a5a'] },
  { name: 'neon', colors: ['#ff4080','#40ff80','#4080ff','#ff8040','#80ff40'] },
  { name: 'matcha', colors: ['#6a9a4a','#9aba6a','#bada8a','#8a9a5a','#aaba7a'] },
  { name: 'blush', colors: ['#e8a0b0','#d080a0','#c0688a','#f0c0d0','#e080b0'] },
  { name: 'saffron', colors: ['#d4a040','#c08030','#b06040','#e8c080','#a08850'] },
  { name: 'glacier', colors: ['#a0c8e8','#80b8d8','#60a8c8','#c0e0f0','#b0d0e8'] },
  { name: 'moss', colors: ['#5a7a4a','#7a9a6a','#9aba8a','#6a8a5a','#8aaa7a'] },
  { name: 'coral', colors: ['#e08060','#f0a080','#d0a080','#b0c0c0','#80b8a0'] },
  { name: 'plum', colors: ['#6a3a7a','#8a5a9a','#a07aaa','#b89aba','#6a5a8a'] },
];
let curPalette = 5;
function currentColor(pos) {
  const p = PALETTES[curPalette];
  return p.colors[pos % p.colors.length];
}

// ---- audio ----
const PENTA = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    } catch (e) { console.log('audioCtx fail:', e); }
  }
}

function synth(freq, vol, dur, wave) {
  if (!audioCtx) return;
  try { if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e) {}
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = wave || 0;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    setTimeout(() => { gain.gain.value = 0; }, Math.round(dur * 1000));
  } catch(e) { console.log('synth:', e); }
}

function playNote(index) {
  const freq = PENTA[index % PENTA.length];
  synth(freq, 0.12, 0.22, 0);
}
function playDrum(t) {
  const freq = t==='k'?70:t==='h'?1200:220;
  const vol = t==='k'?0.28:t==='h'?0.07:0.14;
  const dur = t==='h'?0.04:0.1;
  const wave = t==='k'?0:3;
  synth(freq, vol, dur, wave);
}

// ---- display ----
const MAX_PX = 200;
const MIN_PX = 16;
const STAGE_FRAC = 0.85;

const stage = document.getElementById('stage');
const display = document.getElementById('display');
const letters = document.getElementById('letters');
const hint = document.getElementById('hint');
const pulse = document.getElementById('pulse');
let empty = true;
let charCount = 0;
let curWord = null;

function lastWord() {
  for (let i = letters.children.length - 1; i >= 0; i--) {
    const e = letters.children[i];
    if (e.classList.contains('space')) return null;
    if (e.classList.contains('word')) return e;
  }
  return null;
}

function ensureWord() {
  if (curWord && curWord.parentNode === letters) return;
  curWord = document.createElement('span');
  curWord.classList.add('word');
  letters.appendChild(curWord);
}

function fitWords() {
  if (empty || !letters.children.length) { display.style.fontSize = MAX_PX + 'px'; return; }
  const maxW = stage.clientWidth * STAGE_FRAC;
  const maxH = stage.clientHeight * 0.85;
  let size = MAX_PX;
  display.style.fontSize = size + 'px';
  let maxWordW = 0;
  for (const el of letters.children) {
    if (el.classList.contains('word')) {
      const w = el.offsetWidth;
      if (w > maxWordW) maxWordW = w;
    }
  }
  if (maxWordW > maxW && maxWordW > 0) {
    size = Math.max(MIN_PX, Math.floor(size * maxW / maxWordW * 0.97));
  }
  display.style.fontSize = size + 'px';
  const totalH = display.offsetHeight;
  if (totalH > maxH && totalH > 0) {
    size = Math.max(MIN_PX, Math.floor(size * maxH / totalH * 0.97));
  }
  if (size > MAX_PX) size = MAX_PX;
  display.style.fontSize = size + 'px';
}

function addLetter(ch) {
  initAudio();
  if (empty) { hint.classList.add('hidden'); empty = false; }
  ensureWord();
  const s = document.createElement('span');
  s.classList.add('letter');
  s.textContent = ch;
  s.style.color = currentColor(charCount);
  curWord.appendChild(s);
  void s.offsetWidth;
  s.classList.add('pop');
  if (partyTimer) {
    s.style.animationDelay = `${(charCount % 9) * -0.09}s`;
    setTimeout(() => s.classList.remove('pop'), 350);
  }
  playNote(charCount);
  pulse.classList.add('active');
  setTimeout(() => pulse.classList.remove('active'), 30);
  charCount++;
  fitWords();
}

function addSpace() {
  if (empty) { hint.classList.add('hidden'); empty = false; }
  curWord = null;
  const s = document.createElement('span');
  s.classList.add('letter', 'space');
  s.innerHTML = '&nbsp;';
  letters.appendChild(s);
  charCount++;
  fitWords();
}

function removeLast() {
  const els = letters.children;
  if (els.length === 0) return false;
  charCount = Math.max(0, charCount - 1);
  const last = els[els.length - 1];
  if (last.classList.contains('space')) {
    letters.removeChild(last);
  } else if (last.classList.contains('word')) {
    const wl = last.children;
    if (wl.length > 1) {
      last.removeChild(wl[wl.length - 1]);
    } else {
      letters.removeChild(last);
    }
  }
  curWord = lastWord();
  if (els.length === 0) { empty = true; hint.classList.remove('hidden'); curWord = null; }
  fitWords();
  return true;
}

function clearAll() {
  letters.innerHTML = '';
  charCount = 0;
  empty = true;
  curWord = null;
  hint.classList.remove('hidden');
  display.style.fontSize = MAX_PX + 'px';
}

function cyclePalette() {
  curPalette = (curPalette + 1) % PALETTES.length;
  let ci = 0;
  for (const el of letters.querySelectorAll(':scope > .word > .letter')) {
    el.style.color = currentColor(ci);
    ci++;
  }
  if (partyTimer) {
    const c = PALETTES[curPalette].colors[0];
    const flash = document.getElementById('party-flash');
    flash.style.background = `radial-gradient(circle at 50% 50%, ${hexToRgba(c,0.15)}, transparent)`;
    flash.classList.add('active');
    clearTimeout(flash._t);
    flash._t = setTimeout(() => flash.classList.remove('active'), 350);
  }
  const tag = document.getElementById('palette-tag');
  tag.textContent = PALETTES[curPalette].name;
  tag.classList.add('show');
  clearTimeout(tag._t);
  tag._t = setTimeout(() => tag.classList.remove('show'), 1200);
  updateBtnColor();
}

function hexToRgba(h, a) {
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function updateBtnColor() {
  const c = PALETTES[curPalette].colors[2];
  const btn = document.getElementById('clear-btn');
  btn.style.background = `radial-gradient(circle at 35% 35%, ${hexToRgba(c,0.55)}, ${hexToRgba(c,0.05)})`;
  btn.style.boxShadow = `0 0 0.8rem ${hexToRgba(c,0.25)}`;
}

let partyTimer = null;
// ---- party beat ----
let beatStep = 0;
const BEAT_PATTERN = ['k','.','h','.','k','.','h','s','.','.','h','.','k','.','h','.'];
function stopBeat() { beatStep = 0; }
function startBeat() {
  beatStep = 0;
  const ms = Math.round(60000 / 130 / 4);
  if (beatTimer) clearInterval(beatTimer);
  beatTimer = setInterval(() => {
    const d = BEAT_PATTERN[beatStep % BEAT_PATTERN.length];
    if (d !== '.') playDrum(d);
    beatStep++;
  }, ms);
}
function staggerLetters() {
  let ci = 0;
  for (const el of document.querySelectorAll('.word .letter')) {
    el.style.animationDelay = `${(ci % 9) * -0.09}s`;
    ci++;
  }
}
function clearStagger() {
  for (const el of document.querySelectorAll('.word .letter')) {
    el.style.animationDelay = '';
  }
}
function toggleParty() {
  const btn = document.getElementById('party-btn');
  if (partyTimer) {
    clearInterval(partyTimer);
    partyTimer = null;
    btn.classList.remove('on');
    display.classList.remove('party');
    clearStagger();
    stopBeat();
  } else {
    initAudio();
    cyclePalette();
    partyTimer = setInterval(cyclePalette, 700);
    btn.classList.add('on');
    display.classList.add('party');
    staggerLetters();
    startBeat();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key;
  if (k === 'Backspace') { removeLast(); e.preventDefault(); return; }
  if (k === 'Escape')    { clearAll(); e.preventDefault(); return; }
  if (k === 'Tab')       { cyclePalette(); e.preventDefault(); return; }
  if (k === 'Enter')     { e.preventDefault(); return; }
  if (k === ' ')         { addSpace(); e.preventDefault(); return; }
  if (k.length === 1)    { addLetter(k.toUpperCase()); e.preventDefault(); }
});

document.addEventListener('mousedown', () => document.body.focus());
document.getElementById('clear-btn').addEventListener('click', clearAll);
document.getElementById('party-btn').addEventListener('click', toggleParty);
updateBtnColor();
document.body.focus();
document.body.tabIndex = 0;
</script>
</body>
</html>
